# WS-A (LimiX): INCOMPLETE export spike — see README.md.
# NOT wired into the registry or the build; the exported graph is not yet
# shape-correct (T and S get unified in the feature-grouping reshape).
#
# Intended pipeline — weight-free ONNX graph + tensor map for
# StableAI's LimiX-2M (axis-wise sample/feature attention tabular ICL model).
#
#   uv sync
#   uv run export_limix --task classification --config real --out ./out
#   uv run export_limix --task classification --config fixture --out ./out
#   uv run pytest
#
# LimiX is neither on PyPI nor pip-installable (the repo ships no pyproject), so
# upstream is pinned as the `vendor/limix` GIT SUBMODULE — the same convention
# `vendor/tabfm` already uses. No upstream source is copied into this repo;
# `limix_patches` puts the submodule on sys.path and patches at RUNTIME, the
# same approach as tools/export_tabicl and tools/export_orion_bix.
#
# Upstream CODE is Apache-2.0 (vendor/limix/LICENSE.txt). The WEIGHTS are not:
# "fully open for academic research, commercial use requires official
# authorization from StableAI" — hence commercial:false + a license gate in the
# built-in manifest.
#
# torch is pinned to the CPU index so no CUDA wheels are pulled.
[project]
name = "export-limix"
version = "0.1.0"
description = "anofox-tabfm LimiX exporter: FeaturesTransformer -> weight-free ONNX graph + tensor-name map"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.12.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "einops>=0.7",
    "scikit-learn",
    "numpy",
    "safetensors",
    "huggingface_hub",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
export_limix = "export_limix.cli:main"
make_limix_fixture = "export_limix.fixture_cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export_limix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
