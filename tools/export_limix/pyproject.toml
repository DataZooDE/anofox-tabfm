# WS-A (LimiX): LimiX-2M exporter — see README.md.
#
# Pipeline — weight-free ONNX graph + tensor map for
# StableAI's LimiX-2M (axis-wise sample/feature attention tabular ICL model).
#
#   uv sync
#   uv run export_limix --task classification --config real --out ./out
#   uv run export_limix --task classification --config fixture --out ./out
#   uv run pytest
#
# LimiX is neither on PyPI nor pip-installable (the repo ships no pyproject), so
# upstream is pinned as the `vendor/limix` GIT SUBMODULE — the same convention
# `vendor/tabfm` already uses. No upstream source is copied into this repo;
# `limix_patches` puts the submodule on sys.path and patches at RUNTIME, the
# same approach as tools/export_tabicl and tools/export_orion_bix.
#
# Upstream CODE is Apache-2.0 (vendor/limix/LICENSE.txt). The WEIGHTS are under the "Stable AI Technology
# Co., Ltd. License v1.0" (stable-ai/LimiX-2M LICENSE.txt, 2026-09): Apache-2.0 plus one added Section 10,
# which permits commercial use but requires the attribution "Built with StableAI LimiX" and a "LimiX" prefix
# on the name of any AI model derived from the weights. The older upstream README (vendor/limix) says
# "academic research, commercial with authorization" and the model card is internally inconsistent
# (front matter `license: other`, body "Apache 2.0"); the registry follows the newest LICENSE.txt:
# commercial:true, gated by the licence acknowledgement (accept_hf_license).
#
# torch is pinned to the CPU index so no CUDA wheels are pulled.
[project]
name = "export-limix"
version = "0.1.0"
description = "anofox-tabfm LimiX exporter: FeaturesTransformer -> weight-free ONNX graph + tensor-name map"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.12.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "einops>=0.7",
    "scikit-learn",
    "numpy",
    "safetensors",
    "huggingface_hub",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
export_limix = "export_limix.cli:main"
make_limix_fixture = "export_limix.fixture_cli:main"
convert_limix_weights = "export_limix.convert:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export_limix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
