# Export: Nums AI Causilo (code Apache-2.0; weights Causilo License v1.0, non-commercial)
# -> weight-free ONNX graph + tensor-name map + random-init CI fixture.
#
#   uv sync
#   uv run export_causilo --task classification --config real --out ./out
#   uv run export_causilo --task regression     --config real --out ./out
#   uv run make_causilo_fixture ../../test/fixtures/causilo   # builds the CI fixture
#   uv run pytest
#
# torch is pinned to 2.13.0: the `causilo` package requires torch>=2.13, which is
# newer than the 2.12.1 that tools/export_tabicl and tools/export_onnx pin. No
# checkpoint weights are downloaded by this project's export; real-weight parity
# (parity_real.py) fetches them into the Hugging Face cache, never into the repo.
[project]
name = "export-causilo"
version = "0.1.0"
description = "anofox-tabfm export: Causilo -> weight-free ONNX graph + tensor-name map"
requires-python = ">=3.11"
dependencies = [
    "torch==2.13.0",
    "causilo>=1.0.3",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "numpy",
    "safetensors",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
export_causilo = "export_causilo.cli:main"
make_causilo_fixture = "export_causilo.fixture_cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export_causilo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
