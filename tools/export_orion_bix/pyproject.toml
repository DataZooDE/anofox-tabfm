# WS-A (Orion-BiX): shipping pipeline — weight-free ONNX graph + tensor map for
# Lexsi Labs' Orion-BiX (bi-axial attention tabular ICL model, MIT).
#
#   uv sync
#   uv run export_orion_bix --task classification --config real --out ./out
#   uv run export_orion_bix --task classification --config fixture --out ./out
#   uv run pytest
#
# Orion-BiX is NOT on PyPI, so the upstream package is pinned by git sha rather
# than vendored — no upstream source lives in this repo, and the exact revision
# the graph was traced from is recorded here. Patches are applied at RUNTIME
# (orion_bix_patches.py), the same approach as tools/export_tabicl.
#
# torch is pinned to the CPU index so no CUDA wheels are pulled. Upstream caps
# python at <3.13, hence the requires-python ceiling.
[project]
name = "export-orion-bix"
version = "0.1.0"
description = "anofox-tabfm Orion-BiX exporter: OrionBix -> weight-free ONNX graph + tensor-name map"
requires-python = ">=3.11,<3.13"
dependencies = [
    "orion-bix",
    "torch==2.12.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "numpy",
    "safetensors",
    "huggingface_hub",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
export_orion_bix = "export_orion_bix.cli:main"
make_orion_bix_fixture = "export_orion_bix.fixture_cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# Pinned upstream revision the shipping graph is traced from (MIT).
orion-bix = { git = "https://github.com/Lexsi-Labs/Orion-BiX", rev = "060d34606f56c591c47e0b6cbe971e5f5035f33e" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export_orion_bix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
