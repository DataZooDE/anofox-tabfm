# WS-A: MODL-04 parity validation — validates the tabpfn_v2 fixture's ONNX
# distribution output contract (logits [T,K] + borders [K+1] strictly-increasing)
# before the C++ decoder is trusted.
#
#   uv sync
#   uv run pytest
#   uv run check_tabpfn_v2
#
# No torch dependency — parity only needs onnxruntime + numpy.
[project]
name = "tabfm-parity"
version = "0.1.0"
description = "anofox-tabfm MODL-04: fixture parity validation (distribution tensor contract)"
requires-python = ">=3.11"
dependencies = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "numpy",
    "safetensors",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
check_tabpfn_v2 = "parity.check_tabpfn_v2:main"
build_tabpfn_v2_fixture = "parity.build_fixture:main"
crps_reference = "parity.crps_reference:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
