# WS-A (TabDPT): shipping pipeline — weight-free ONNX graph + tensor map for
# Layer 6 AI's TabDPT (retrieval-pretrained tabular ICL model, Apache-2.0).
#
#   uv sync
#   uv run export_tabdpt --task classification --config real --out ./out
#   uv run export_tabdpt --task classification --config fixture --out ./out
#   uv run pytest
#
# TabDPT is on PyPI, so unlike Orion-BiX/Orion-MSP the upstream package is a
# normal pinned dependency rather than a git sha. Patches are applied at RUNTIME
# (tabdpt_patches.py) — no upstream source is vendored or edited.
#
# NOTE: TabDPT is the first catalog model that needs NO convert_weights.py step.
# Layer 6 publish the checkpoint as safetensors already
# (Layer6/TabDPT :: tabdpt1_2.safetensors, Apache-2.0, ungated), so the engine
# can inject the downloaded file directly against the committed tensor map.
#
# torch is pinned to the CPU index so no CUDA wheels are pulled.
[project]
name = "export-tabdpt"
version = "0.1.0"
description = "anofox-tabfm TabDPT exporter: TabDPTModel -> weight-free ONNX graph + tensor-name map"
requires-python = ">=3.11"
dependencies = [
    "tabdpt==1.2.0",
    "torch==2.12.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "numpy",
    "safetensors",
    "huggingface_hub",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
export_tabdpt = "export_tabdpt.cli:main"
make_tabdpt_fixture = "export_tabdpt.fixture_cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export_tabdpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
