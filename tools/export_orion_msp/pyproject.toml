# WS-A (Orion-MSP): shipping pipeline — weight-free ONNX graph + tensor map for
# Lexsi Labs' Orion-MSP (multi-scale sparse-attention tabular ICL model, MIT).
#
#   uv sync
#   uv run export_orion_msp --task classification --config real --out ./out
#   uv run export_orion_msp --task classification --config fixture --out ./out
#   uv run pytest
#
# Orion-MSP is NOT on PyPI, so the upstream package is pinned by git sha rather
# than vendored — no upstream source lives in this repo, and the exact revision
# the graph was traced from is recorded here. Patches are applied at RUNTIME
# (orion_bix_patches.py), the same approach as tools/export_tabicl.
#
# torch is pinned to the CPU index so no CUDA wheels are pulled. Upstream caps
# python at <3.13, hence the requires-python ceiling.
[project]
name = "export-orion-msp"
version = "0.1.0"
description = "anofox-tabfm Orion-MSP exporter: OrionMSP -> weight-free ONNX graph + tensor-name map"
requires-python = ">=3.11,<3.13"
dependencies = [
    "orion-msp",
    "torch==2.12.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "numpy",
    "safetensors",
    "huggingface_hub",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
export_orion_msp = "export_orion_msp.cli:main"
make_orion_msp_fixture = "export_orion_msp.fixture_cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# Pinned upstream revision the shipping graph is traced from (MIT).
orion-msp = { git = "https://github.com/Lexsi-Labs/Orion-MSP", rev = "c89aea6dc425bc701a9557fdd53e3dc3d766f983" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export_orion_msp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
