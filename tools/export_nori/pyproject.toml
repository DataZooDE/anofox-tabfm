# WS-A (Nori): Synthefy Nori-30M exporter -- see README.md.
#
#   uv sync
#   uv run export_nori --config real --out ./out          # regression graph + tensor map, weight-free
#   uv run make_nori_fixture ../../test/fixtures/nori      # the committed random-init CI fixture
#   uv run pytest                                          # TABFM_REAL_WEIGHTS=1 adds the real-weight tests
#
# Upstream is the PyPI package `synthefy-nori` (Apache-2.0 code AND weights), pinned exactly: the
# exporter patches its FeaturesTransformer at RUNTIME (nori_patches.py); no upstream source is copied
# into this repo, the same approach as tools/export_tabicl / tools/export_causilo.
#
# torch is pinned to the CPU index so no CUDA wheels are pulled.
[project]
name = "export-nori"
version = "0.1.0"
description = "anofox-tabfm Nori exporter: FeaturesTransformer (regression) -> weight-free ONNX graph + tensor-name map"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.12.1",
    "synthefy-nori==0.22.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "numpy",
    "safetensors",
    "scikit-learn",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
export_nori = "export_nori.cli:main"
make_nori_fixture = "export_nori.fixture_cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export_nori"]

[tool.pytest.ini_options]
testpaths = ["tests"]
