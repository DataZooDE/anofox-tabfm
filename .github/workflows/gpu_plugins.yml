#
# Build the GPU backend plugins (docs/GGML_PLAN.md).
#
# CUDA and ROCm are both served by the ggml GPU plugin (src/tabfm_ggml_plugin.cpp, tools/ggml_plugin/CMakeLists.txt): the same engine as the CPU, built
# once per vendor. Apple GPUs use the MLX plugin. None of them needs a GPU to BUILD; a GPU is required to RUN them, which the manual harnesses under
# tools/gpu_test/ and test/sql/tabfm_gpu_use_cases.test cover on real hardware.
#
# Deliberately separate from MainDistributionPipeline.yml (scaffold-owned): the plugins version independently of the extension binary, and this
# workflow needs none of the DuckDB platform matrix.
#
# Every push builds and uploads workflow artifacts (sanity: the plugin ABI symbol is exported, the CUDA plugin needs no shared CUDA runtime library,
# dlopen answers and create fails cleanly without a GPU). A version tag attaches the plugins plus sha256 sidecars to the GitHub release, which is what
# tabfm_download_runtime() fetches; scripts/check_plugin_release_assets.py keeps that list equal to what the extension asks for.
#
name: GPU backend plugins

# Only `main` and release tags on push. Without the branch filter a
# same-repo pull request matches BOTH `push` (refs/heads/<branch>) and
# `pull_request` (refs/pull/N/merge), so every commit ran this whole workflow
# TWICE -- two macOS builds, two Windows builds, for identical trees. The
# concurrency group keys on github.ref, which differs between the two, so
# nothing deduplicated them and they simply queued against each other.
#
# `pull_request` still covers every branch, including forks. `main` and `v*`
# stay on push because the deploy and plugin-attach jobs key off those refs.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # release-asset upload on tags; read is enough elsewhere

jobs:
  asset-list:
    name: The release publishes exactly what tabfm_download_runtime fetches
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_plugin_release_assets.py

  ggml-cuda-plugin:
    name: ggml CUDA plugin (linux amd64, CUDA 12.8, static CUDA runtime)
    timeout-minutes: 180
    runs-on: ubuntu-22.04
    # CUDA 12.8 is the first toolkit with Blackwell (sm_100, sm_120). The CUDA runtime and cuBLAS are linked statically, so the user needs only the
    # NVIDIA driver. ggml's flash-attention kernels are not built: the lowering never emits them, and they would multiply the plugin's size.
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq git cmake ninja-build binutils gcc
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the plugin
        run: |
          cmake -S tools/ggml_plugin -B build/ggml-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release -DTABFM_GGML_GPU=cuda -DGGML_CUDA_NCCL=OFF \
            -DGGML_CUDA_FA=OFF "-DCMAKE_CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;90-real;100-real;120"
          cmake --build build/ggml-cuda
          cp build/ggml-cuda/libanofox_tabfm_ggml-cuda_plugin.so .
          strip --strip-unneeded libanofox_tabfm_ggml-cuda_plugin.so
      - name: Sanity - ABI symbol exported, no shared CUDA runtime needed, size
        run: |
          nm -D --defined-only libanofox_tabfm_ggml-cuda_plugin.so | grep -q ' TabFMGetPluginApi$' || { echo "ABI symbol missing"; exit 1; }
          bash scripts/check_plugin_deps.sh libanofox_tabfm_ggml-cuda_plugin.so
          ls -l libanofox_tabfm_ggml-cuda_plugin.so
          test "$(stat -c %s libanofox_tabfm_ggml-cuda_plugin.so)" -lt 2000000000 || { echo "over GitHub's 2 GB release-asset limit"; exit 1; }
          sha256sum libanofox_tabfm_ggml-cuda_plugin.so | tee ggml-cuda_plugin.sha256
      - name: Load check - dlopen answers and create fails gracefully without a GPU
        run: |
          gcc -O2 -o plugin_load_check tools/gpu_test/plugin_load_check.c -ldl
          # The plugin needs only the driver's libcuda.so.1 (the runtime is linked statically), and a build container has no driver: the
          # toolkit's stub stands in for it, so dlopen resolves and create fails cleanly, as it does on a machine without an NVIDIA GPU.
          mkdir -p cuda-stub && ln -sf /usr/local/cuda/lib64/stubs/libcuda.so cuda-stub/libcuda.so.1
          LD_LIBRARY_PATH="$PWD/cuda-stub" ./plugin_load_check ./libanofox_tabfm_ggml-cuda_plugin.so
      - uses: actions/upload-artifact@v4
        with:
          name: anofox-tabfm-ggml-cuda-plugin
          path: |
            libanofox_tabfm_ggml-cuda_plugin.so
            ggml-cuda_plugin.sha256
          if-no-files-found: error

  ggml-rocm-plugin:
    name: ggml ROCm plugin (linux amd64, ROCm 7.2, HIP)
    timeout-minutes: 240
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the HIP SDK from the ROCm apt repo
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.4 jammy main" | \
            sudo tee /etc/apt/sources.list.d/rocm.list
          # AMD's packages must win over Ubuntu's same-named ones (Ubuntu ships an unrelated rocm-device-libs 5.0.0, a higher version
          # number than ROCm 7's): pin repo.radeon.com, as AMD's install guide does.
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update -qq
          # rocm-device-libs: the amdgcn bitcode clang links into every HIP kernel (without it CMake's HIP compiler check fails with
          # "cannot find ROCm device library")
          sudo apt-get install -y -qq hipblas-dev rocblas-dev hip-dev rocm-llvm rocm-device-libs rocm-cmake ninja-build
      - name: Build the plugin
        # RDNA2..RDNA4 consumer cards and the APU iGPUs (gfx1150/1151 verified), plus CDNA data-center cards. HIP is linked from the user's ROCm install.
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/lib/llvm/bin:$PATH ROCM_PATH=/opt/rocm HIP_PATH=/opt/rocm
          L=/opt/rocm/lib/llvm/bin
          BC=$(dirname "$(find /opt/rocm/ -name ocml.bc -print -quit)")
          echo "device libraries: $BC"; test -f "$BC/ocml.bc"
          cmake -S tools/ggml_plugin -B build/ggml-rocm -G Ninja -DCMAKE_BUILD_TYPE=Release -DTABFM_GGML_GPU=hip -DGGML_HIP_NO_VMM=ON \
            -DCMAKE_CXX_COMPILER=$L/clang++ -DCMAKE_C_COMPILER=$L/clang -DCMAKE_HIP_COMPILER=$L/clang++ "-DCMAKE_HIP_FLAGS=--rocm-path=/opt/rocm --rocm-device-lib-path=$BC" -DCMAKE_PREFIX_PATH=/opt/rocm \
            "-DAMDGPU_TARGETS=gfx1030;gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201;gfx90a;gfx942"
          cmake --build build/ggml-rocm -j4
          cp build/ggml-rocm/libanofox_tabfm_ggml-rocm_plugin.so .
          strip --strip-unneeded libanofox_tabfm_ggml-rocm_plugin.so
      - name: Sanity - ABI symbol exported
        run: |
          nm -D --defined-only libanofox_tabfm_ggml-rocm_plugin.so | grep -q ' TabFMGetPluginApi$' || { echo "ABI symbol missing"; exit 1; }
          readelf -d libanofox_tabfm_ggml-rocm_plugin.so | grep NEEDED
          ls -l libanofox_tabfm_ggml-rocm_plugin.so
          sha256sum libanofox_tabfm_ggml-rocm_plugin.so | tee ggml-rocm_plugin.sha256
      - name: Load check - dlopen answers and create fails gracefully without a GPU
        run: |
          gcc -O2 -o plugin_load_check tools/gpu_test/plugin_load_check.c -ldl
          LD_LIBRARY_PATH=/opt/rocm/lib ./plugin_load_check ./libanofox_tabfm_ggml-rocm_plugin.so
      - uses: actions/upload-artifact@v4
        with:
          name: anofox-tabfm-ggml-rocm-plugin
          path: |
            libanofox_tabfm_ggml-rocm_plugin.so
            ggml-rocm_plugin.sha256
          if-no-files-found: error

  mlx-plugin:
    name: MLX plugin (Apple Silicon; links libmlx/libmlxc, no ORT)
    timeout-minutes: 15
    # macos-14 images are retired on 2026-11-02 (scheduled brownouts already fail jobs); macos-15 is arm64 too.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install MLX
        # The plugin links Apple's runtime, which is installed on the machine
        # rather than shipped by us. mlx-c is the C API; mlx is the engine.
        run: brew install mlx mlx-c

      - name: Build the plugin
        # Three sources, and no libonnx/libprotobuf: the plugin parses the ONNX
        # wire format itself (src/tabfm_onnx_reader.cpp) so a separately
        # distributed .dylib is not coupled to protobuf's ABI.
        # mlx-c 0.7 changed two calls the plugin makes and has no version macro, so probe for the new
        # API exactly as CMakeLists.txt does and pass the same TABFM_MLX_C_07 switch (Homebrew moved to
        # 0.7, which broke this job while the CMake build kept working).
        run: |
          cat > mlxc_probe.cpp <<'PROBE'
          #include "mlx/c/ops.h"
          int main() {
              mlx_array r = mlx_array_new();
              mlx_optional_dtype none;
              none.has_value = false;
              return mlx_cumsum_axis(&r, r, 0, false, true, none, mlx_default_cpu_stream_new());
          }
          PROBE
          MLXC_FLAGS=""
          if clang++ -std=c++17 mlxc_probe.cpp -o mlxc_probe -I"$(brew --prefix)/include" \
               -L"$(brew --prefix)/lib" -lmlxc -lmlx 2>/dev/null; then
            MLXC_FLAGS="-DTABFM_MLX_C_07=1"
          fi
          echo "mlx-c $(brew list --versions mlx-c): ${MLXC_FLAGS:-pre-0.7 API}"
          clang++ -O2 -std=c++17 -shared -fPIC -fvisibility=hidden $MLXC_FLAGS \
            -o libanofox_tabfm_mlx_plugin.dylib \
            src/tabfm_mlx_plugin.cpp src/tabfm_mlx_graph.cpp src/tabfm_onnx_reader.cpp \
            -Isrc/include -I"$(brew --prefix)/include" \
            -L"$(brew --prefix)/lib" -lmlxc -lmlx

      - name: Sanity - one exported symbol, and only the expected dependencies
        run: |
          nm -gU libanofox_tabfm_mlx_plugin.dylib | grep -q "_TabFMGetPluginApi" \
            || { echo "ABI symbol missing"; exit 1; }
          # -fvisibility=hidden means the entry point should be the ONLY export.
          test "$(nm -gU libanofox_tabfm_mlx_plugin.dylib | wc -l)" -eq 1 \
            || { echo "unexpected extra exports:"; nm -gU libanofox_tabfm_mlx_plugin.dylib; exit 1; }
          otool -L libanofox_tabfm_mlx_plugin.dylib
          # Guard the design decision, not just the build: if libonnx or
          # libprotobuf ever appear here, the dependency-light property is gone.
          ! otool -L libanofox_tabfm_mlx_plugin.dylib | grep -qE "libonnx|libprotobuf" \
            || { echo "plugin linked onnx/protobuf; see tabfm_onnx_reader.hpp"; exit 1; }
          shasum -a 256 libanofox_tabfm_mlx_plugin.dylib | tee mlx_plugin.sha256

      # A GitHub macOS runner has Apple Silicon but no model cache, so this
      # proves the artifact RESOLVES and refuses cleanly -- the same contract
      # the ggml CUDA and ROCm jobs assert on GPU-less machines.
      - name: Load check - dlopen answers and create fails gracefully
        run: |
          cc -O2 -o plugin_load_check tools/gpu_test/plugin_load_check.c
          ./plugin_load_check ./libanofox_tabfm_mlx_plugin.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: anofox-tabfm-mlx-plugin
          path: |
            libanofox_tabfm_mlx_plugin.dylib
            mlx_plugin.sha256
          if-no-files-found: error

  publish:
    name: Attach plugins to the release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [asset-list, ggml-cuda-plugin, ggml-rocm-plugin, mlx-plugin]
    timeout-minutes: 25
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: The pinned plugin release must be the one being published
        run: |
          # TABFM_PLUGIN_RELEASE_TAG is what tabfm_download_runtime fetches
          # from. If a release ships without it pointing at itself, every
          # download from that build silently fetches the PREVIOUS release's
          # plugins -- which the loader will accept whenever the ABI version
          # still matches, so nothing tells the user they got an old one.
          pinned="$(sed -n 's/.*TABFM_PLUGIN_RELEASE_TAG = "\(.*\)".*/\1/p' \
                    src/include/tabfm_plugin_artifacts.hpp)"
          echo "pinned in source: ${pinned}"
          echo "tag being built:  ${GITHUB_REF_NAME}"
          if [ "${pinned}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::TABFM_PLUGIN_RELEASE_TAG is '${pinned}' but this is '${GITHUB_REF_NAME}'." \
                 "Bump it in src/include/tabfm_plugin_artifacts.hpp before tagging, so the release" \
                 "contains code that points at itself."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release upload does NOT create the release object; a tag pushed
          # before a human creates one would red-fail here and ship the pinned
          # release without its plugins (review finding, 2026-08-22).
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
            --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" \
            libanofox_tabfm_ggml-cuda_plugin.so \
            libanofox_tabfm_ggml-rocm_plugin.so \
            libanofox_tabfm_mlx_plugin.dylib \
            ggml-cuda_plugin.sha256 ggml-rocm_plugin.sha256 mlx_plugin.sha256 \
            --repo "${GITHUB_REPOSITORY}" --clobber
