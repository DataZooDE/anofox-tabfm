#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
# Only `main` and release tags on push. Without the branch filter a
# same-repo pull request matches BOTH `push` (refs/heads/<branch>) and
# `pull_request` (refs/pull/N/merge), so every commit ran this whole workflow
# TWICE -- two macOS builds, two Windows builds, for identical trees. The
# concurrency group keys on github.ref, which differs between the two, so
# nothing deduplicated them and they simply queued against each other.
#
# `pull_request` still covers every branch, including forks. `main` and `v*`
# stay on push because the deploy and plugin-attach jobs key off those refs.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-v1_5_5-build:
    name: Build extension binaries (v1.5.5, cpu flavor)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: anofox_tabfm
      # ONNX Runtime comes from the prebuilt release archive by default
      # (cmake/ort.cmake); enable the "ort-vcpkg" manifest feature to build the
      # vcpkg port instead (S05 decision: both paths wired, prebuilt default).
      # Exclude WASM/musl (NFR-C1: explicitly out — ORT + multi-GB inference),
      # MinGW (vcpkg OpenSSL build issues, house pattern), and osx_amd64:
      # ONNX Runtime published its last macOS x86_64 / universal2 archive at
      # v1.23.2, so there is nothing to link Intel macOS against at the version
      # this project needs. cmake/ort.cmake fails with that explanation if the
      # arch is requested anyway.
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64

  duckdb-v1_5_5-smoke-test:
    name: Smoke test (v1.5.5)
    needs: duckdb-v1_5_5-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.5
      extension_name: anofox_tabfm
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64'

  duckdb-v1_5_5-deploy:
    name: Deploy extension binaries (v1.5.5)
    needs: [duckdb-v1_5_5-build, duckdb-v1_5_5-smoke-test]
    # Deploy only ever uploads on main or a v* tag (deploy_latest/deploy_versioned
    # below) -- everything else, including every PR, is a dry run that still pays
    # for "Configure AWS Credentials" and fails there for a fork PR (no repo
    # secrets/OIDC for fork-triggered pull_request runs -- a GitHub Actions
    # security boundary, not something fixable from workflow config). Skipping
    # the whole job outside that condition turns that into a grey "skipped"
    # instead of a red, permanently-failing, ignorable check on every PR.
    #
    # success() is explicit: a job-level `if:` replaces the implicit success()
    # check GitHub applies to `needs` by default, so without it deploy could run
    # on main/a tag even if build or smoke-test failed.
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.5
      extension_name: anofox_tabfm
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
