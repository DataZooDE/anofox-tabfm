#
# Build the ggml GPU plugin (tools/ggml_plugin, docs/GGML_PLAN.md "P8 result").
#
# It needs no GPU to BUILD: the CUDA toolkit in the container is enough, and the same steps were run by hand on an RTX 4090 (CUDA 12.4,
# sm_89: the build and the ABI check in tools/ggml_plugin/abi_check.cpp passed). A GPU is needed to RUN it; tools/gpu_test/scenarios/
# ggml_plugin_gpu.sql is the manual harness. Separate from MainDistributionPipeline.yml (scaffold-owned) for the same reason gpu_plugins.yml is.
#
name: ggml GPU plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/ggml_plugin/**"
      - "src/tabfm_ggml_plugin.cpp"
      - "src/tabfm_ggml_lower.cpp"
      - "src/tabfm_shape_eval.cpp"
      - "src/tabfm_onnx_reader.cpp"
      - "src/include/tabfm_plugin_abi.h"
      - ".github/workflows/ggml_plugin.yml"
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ggml-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    name: ggml CUDA plugin (linux amd64, CUDA 12.4)
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq git cmake ninja-build libnccl-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        # sm_75 (Turing) .. sm_90 (Hopper); the GPU needs no PTX JIT on these, and the CPU part is baseline x86-64 (GGML_NATIVE=OFF).
        run: cmake -S tools/ggml_plugin -B build/ggml-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release -DTABFM_GGML_GPU=cuda "-DCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90"
      - name: Build
        run: cmake --build build/ggml-cuda
      - name: Sanity - the plugin ABI entry point is exported and the file has the host's name
        run: |
          set -e
          plugin=build/ggml-cuda/libanofox_tabfm_ggml-cuda_plugin.so
          test -f "$plugin"
          nm -D --defined-only "$plugin" | grep -q ' TabFMGetPluginApi$'
          ls -l "$plugin"
          sha256sum "$plugin" | tee "$plugin.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ggml-cuda-plugin-linux-amd64
          path: |
            build/ggml-cuda/libanofox_tabfm_ggml-cuda_plugin.so
            build/ggml-cuda/libanofox_tabfm_ggml-cuda_plugin.so.sha256
